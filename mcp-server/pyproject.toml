[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hr-tools-mcp"
version = "0.1.0"
description = "HR Tools MCP Server"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "pydantic>=2.0",
    "python-dateutil>=2.8",
]

[tool.setuptools.packages.find]
where = ["."]
