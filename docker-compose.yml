version: '3.8'

services:
  ollama:
    image: ollama/ollama:latest
    container_name: hr-agent-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    # On first run, pull the model:
    # docker exec hr-agent-ollama ollama pull llama3.1:8b-instruct-q5_K_M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  ollama_data:
